$engine: 4
$meta:
  name: ESX Magyar + Ox Inv + SD-Phone
  version: 1.0.0
  author: Gemini
  description: Alap ESX Legacy magyar nyelven, ox_inventory és sd-phone konfigurációval.

tasks:
  - action: download_github
    src: https://github.com/overextended/oxmysql
    ref: main
    dest: ./resources/[ox]/oxmysql

  - action: download_github
    src: https://github.com/overextended/ox_lib
    ref: main
    dest: ./resources/[ox]/ox_lib

  - action: download_github
    src: https://github.com/overextended/ox_inventory
    ref: main
    dest: ./resources/[ox]/ox_inventory

  - action: download_github
    src: https://github.com/esx-framework/esx-legacy
    ref: main
    dest: ./resources/[esx]

  # Mappa létrehozása a fizetős sd-phone számára
  - action: waste_time
    seconds: 1
  - action: command
    command: mkdir -p ./resources/[phone]/sd-phone

  - action: connect_database
  - action: query_database
    file: ./resources/[esx]/es_extended/es_extended.sql
  - action: query_database
    file: ./resources/[ox]/ox_inventory/ox_inventory.sql

  - action: file_write
    file: ./server.cfg
    data: |
      endpoint_add_tcp "0.0.0.0:30120"
      endpoint_add_udp "0.0.0.0:30120"

      sv_maxclients 48
      sv_endpointprivacy true
      set steam_webApiKey "IDE_IRD_A_STEAM_API_KULCSOD"
      sv_licenseKey "IDE_IRD_A_FIVEM_KULCSOD"

      sv_hostname "ESX Magyar Szerver | Ox Inv | SD-Phone"
      sets sv_projectName "ESX HU"
      sets sv_projectDesc "Egyedi txAdmin Recipe"
      sets locale "hu-HU"

      # Adatbázis kapcsolat
      set mysql_connection_string "{{dbConnectionString}}"
      set mysql_ui true

      # --- OX Rendszer Beállítások ---
      setr inventory:framework "esx"
      setr inventory:weight 30000
      setr inventory:slots 50
      setr ox:locale "hu"

      # --- ESX Beállítások ---
      setr esx:locale "hu"

      # --- Alapvető erőforrások ---
      ensure chat
      ensure spawnmanager
      ensure sessionmanager
      ensure hardcap
      ensure baseevents

      # --- OX & Adatbázis ---
      ensure oxmysql
      ensure ox_lib

      # --- ESX Core ---
      ensure es_extended
      ensure [esx]

      # --- OX Inventory ---
      ensure ox_inventory

      # --- Telefon ---
      # Töltsd fel az sd-phone fájljait a resources/[phone]/sd-phone mappába!
      ensure sd-phone
